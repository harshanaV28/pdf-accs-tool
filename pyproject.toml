[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-accessibility-inspector"
version = "1.0.0"
description = "Professional Windows desktop application for PDF accessibility validation (PDF/UA ISO 14289-1, WCAG 2.1/2.2 AA, Matterhorn Protocol)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PDF Accessibility Inspector Team"}
]
keywords = ["pdf", "accessibility", "pdf-ua", "wcag", "a11y", "matterhorn-protocol", "validator"]
dependencies = [
    "PySide6>=6.6.0",
    "pymupdf>=1.24.0",
    "pikepdf>=8.0.0",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0"
]

[project.scripts]
pdf-inspector = "pdf_inspector.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
